name: Say thanks to contributors

on:
  pull_request_target:
    types: [closed]

jobs:
  if_merged:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Add thank you note
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const creator = pr.user.login;
            const { owner, repo } = context.repo;

            // Search for merged PRs by this author in this repository
            const q = `author:${creator} is:pr is:merged repo:${owner}/${repo}`;
            const searchResult = await github.rest.search.issuesAndPullRequests({ q });

            // Check if there are other merged PRs by this user
            const hasOtherMergedPRs = searchResult.data.items.some(item => item.number !== pr.number) || searchResult.data.total_count > 1;

            const users = [
              `@${creator}`,
              ...pr.assignees.map(a => `@${a.login}`)
            ];
            const tagged_users = [...new Set(users)].join(" ");

            let message_body = '';

            if (!hasOtherMergedPRs) {
              // Message for the first merged PR
              message_body = `${tagged_users}\n\n🎉 Congratulations on your first merged PR! 🚀\n\nWe'd love to recognize your contribution with a Kerala Coders Cafe Contributor Certificate.\n\n📧 If you'd like to receive one, please email keralacoderscafe@gmail.com with:\n\nGitHub Username\nPR Link\nFull Name (for the certificate)\n\nThank you for being part of our open-source community! 💙`;
            } else {
              // Message for subsequent merged PRs
              message_body = `${tagged_users}\n\nThank you for your contribution! 🚀 Your changes have been successfully merged. We appreciate your time and support in making Toddy Finder better for everyone! 💙`;
            }

            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: owner,
              repo: repo,
              body: message_body
            });
